name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python 3.10 = the version shipped with ROS 2 Humble on the robot.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # rclpy comes from ROS and is replaced by a small fake in tests/conftest.py.
      - name: Install dependencies
        run: pip install "mcp<2" anyio requests numpy opencv-python-headless "pytest<9"

      - name: Run tests
        run: pytest -q tests
